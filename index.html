<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Optimization -->
    <title id="site-title">EFRINFLIX | مشاهدة أحدث الأفلام والمسلسلات مترجمة مجاناً</title>
    <meta name="description" id="meta-desc" content="منصة EFRINFLIX لمشاهدة أحدث الأفلام العربية والأجنبية والمسلسلات المترجمة بجودة عالية HD بدون إعلانات مزعجة وبث مباشر سريع.">
    <meta name="keywords" content="افلام مترجمة, مسلسلات 2026, مشاهدة افلام اون لاين, افلام اكشن, EFRINFLIX, افلام سينما, ايجي بست, عرب سيد">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    <link rel="canonical" id="canonical-url" href="https://efrinflix.com/">

    <!-- Social Media Meta (Open Graph & Twitter) -->
    <meta property="og:locale" content="ar_AR">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="EFRINFLIX">
    <meta property="og:url" id="og-url" content="https://efrinflix.com/">
    <meta property="og:title" id="og-title" content="EFRINFLIX | مشاهدة أحدث الأفلام والمسلسلات مترجمة مجاناً">

    <!-- Tailwind CSS & Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fff1f2',
                            500: '#e11d48',
                            600: '#e11d48',
                            700: '#be123c',
                            900: '#4c0519',
                        },
                        darkbg: '#0b0f17',
                        cardbg: '#161d2a'
                    },
                    fontFamily: {
                        sans: ['Tajawal', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #0b0f17;
            color: #f3f4f6;
            overflow-x: hidden;
        }
        .glass-panel {
            background: rgba(22, 29, 42, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .ad-shield {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
            background: rgba(0,0,0,0.001);
            cursor: pointer;
        }

        .skeleton {
            background: linear-gradient(90deg, #161d2a 25%, #222d3d 50%, #161d2a 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }
        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>

    <!-- Schema.org Structural Data for Google -->
    <script type="application/ld+json" id="schema-json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "EFRINFLIX",
      "alternateName": "إفرينفليكس",
      "url": "https://efrinflix.com/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://efrinflix.com/?view=search&q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-brand-500 selection:text-white">

    <!-- Navbar -->
    <header class="sticky top-0 z-50 glass-panel border-b border-white/5">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
            
            <a href="javascript:void(0)" onclick="navHome()" class="flex items-center gap-2 group">
                <div class="bg-brand-500 p-2.5 rounded-xl shadow-lg shadow-brand-500/30 group-hover:scale-105 transition-transform">
                    <i data-lucide="clapperboard" class="w-6 h-6 text-white"></i>
                </div>
                <span class="text-2xl font-black tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-white via-gray-200 to-brand-500">
                    EFRIN<span class="text-brand-500">FLIX</span>
                </span>
            </a>

            <!-- Search Bar -->
            <div class="flex-1 max-w-md relative">
                <div class="relative">
                    <input type="text" id="search-input" onkeyup="handleSearchKey(event)" placeholder="ابحث عن فيلم أو مسلسل..." 
                        class="w-full bg-slate-900/80 border border-white/10 rounded-full py-2.5 pr-11 pl-4 text-sm text-white placeholder-gray-400 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all">
                    <button onclick="performSearch()" class="absolute right-3.5 top-3 text-gray-400 hover:text-white transition">
                        <i data-lucide="search" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <!-- Actions -->
            <div class="flex items-center gap-3">
                <button onclick="openSpinWheel()" class="hidden sm:flex items-center gap-2 bg-gradient-to-r from-amber-500 to-orange-500 text-white px-4 py-2 rounded-full font-bold text-xs shadow-lg hover:brightness-110 transition">
                    <i data-lucide="dices" class="w-4 h-4"></i>
                    <span>دولاب الحظ</span>
                </button>

                <button onclick="showFavorites()" class="p-2.5 rounded-full bg-slate-800/80 hover:bg-slate-700 text-gray-300 hover:text-white transition relative">
                    <i data-lucide="bookmark" class="w-5 h-5"></i>
                    <span id="fav-badge" class="hidden absolute -top-1 -right-1 bg-brand-500 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Dynamic Content Container -->
    <main id="app-container" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full flex-grow">
        <!-- Dynamic Content -->
    </main>

    <!-- Spin Wheel Modal -->
    <div id="wheel-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="glass-panel max-w-sm w-full rounded-3xl p-6 text-center relative border border-white/10">
            <button onclick="closeSpinWheel()" class="absolute top-4 left-4 text-gray-400 hover:text-white">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
            <h3 class="text-xl font-bold mb-2">عجلة الحظ الرقمية 🎲</h3>
            <p class="text-xs text-gray-400 mb-6">محتار ماذا تشاهد؟ دع العجلة تختار لك فيلم السهرة!</p>
            
            <div class="relative w-48 h-48 mx-auto mb-6 flex items-center justify-center border-4 border-brand-500/30 rounded-full shadow-2xl">
                <div id="wheel-display" class="text-center px-4">
                    <i data-lucide="sparkles" class="w-10 h-10 text-amber-400 mx-auto mb-2 animate-bounce"></i>
                    <span class="text-sm font-semibold text-gray-300">اضغط العجلة للبدء</span>
                </div>
            </div>

            <button onclick="spinWheelAction()" id="spin-btn" class="w-full bg-brand-500 hover:bg-brand-600 text-white py-3 rounded-xl font-bold shadow-lg shadow-brand-500/30 transition">
                ادِر العجلة الآن!
            </button>
        </div>
    </div>

    <!-- Footer -->
    <footer class="glass-panel border-t border-white/5 py-8 mt-12 text-center text-xs text-gray-500">
        <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <p>© 2026 EFRINFLIX. جميع الحقوق محفوظة.</p>
            <p class="text-gray-400">منصة الأفلام والمسلسلات الأولى للمشاهدة المباشرة.</p>
        </div>
    </footer>

    <script>
        const TMDB_API_KEY = '8265bd1679663a7ea12ac168da84d2e8';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';
        const BACKDROP_URL = 'https://image.tmdb.org/t/p/w1280';
        
        let favorites = JSON.parse(localStorage.getItem('efrinflix_favs') || '[]');
        let searchTimeout = null;

        document.addEventListener("DOMContentLoaded", () => {
            lucide.createIcons();
            updateFavBadge();
            handleRouting();
            
            window.addEventListener('popstate', handleRouting);
        });

        // Search Handlers with Debounce
        function handleSearchKey(e) {
            if (e.key === 'Enter') {
                performSearch();
                return;
            }
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                if (document.getElementById('search-input').value.trim().length >= 2) {
                    performSearch();
                }
            }, 500);
        }

        // Routing System
        function handleRouting() {
            const params = new URLSearchParams(window.location.search);
            const view = params.get('view');
            const id = params.get('id');
            const type = params.get('type') || 'movie';

            if (view === 'watch' && id) {
                renderPlayerPage(id, type);
            } else if (view === 'search') {
                const q = params.get('q');
                if (q) fetchSearchResults(q);
            } else if (view === 'favorites') {
                renderFavoritesPage();
            } else {
                renderHomePage();
            }
        }

        function navigateTo(url) {
            window.history.pushState({}, '', url);
            handleRouting();
        }

        function navHome() {
            document.getElementById('search-input').value = '';
            navigateTo(window.location.pathname);
        }

        // Fetch Data Helpers
        async function fetchAPI(endpoint) {
            try {
                const res = await fetch(`${BASE_URL}${endpoint}?api_key=${TMDB_API_KEY}&language=ar-SA`);
                return await res.json();
            } catch (err) {
                console.error(err);
                return null;
            }
        }

        // Skeleton Loaders
        function renderSkeletons() {
            return Array(10).fill(0).map(() => `
                <div class="rounded-xl overflow-hidden glass-panel">
                    <div class="aspect-[2/3] skeleton"></div>
                    <div class="p-3 space-y-2">
                        <div class="h-4 skeleton rounded w-3/4"></div>
                        <div class="h-3 skeleton rounded w-1/2"></div>
                    </div>
                </div>
            `).join('');
        }

        // Render Home Page
        async function renderHomePage() {
            updateSEO("EFRINFLIX | مشاهدة أحدث الأفلام والمسلسلات مترجمة مجاناً", "منصة EFRINFLIX لمشاهدة أحدث الأفلام والمسلسلات العربية والأجنبية مترجمة بجودة عالية بدون إعلانات.");
            const app = document.getElementById('app-container');
            
            app.innerHTML = `
                ${renderContinueWatchingSection()}
                
                <section class="mb-10">
                    <h1 class="text-2xl font-black mb-4 flex items-center gap-2 text-white">
                        <i data-lucide="flame" class="text-brand-500"></i> أحدث الأفلام الأكثر رواجاً
                    </h1>
                    <div id="trending-movies" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                        ${renderSkeletons()}
                    </div>
                </section>

                <section>
                    <h2 class="text-2xl font-black mb-4 flex items-center gap-2 text-white">
                        <i data-lucide="tv" class="text-brand-500"></i> المسلسلات الأكثر مشاهدة
                    </h2>
                    <div id="trending-tv" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                        ${renderSkeletons()}
                    </div>
                </section>
            `;
            lucide.createIcons();

            const movies = await fetchAPI('/trending/movie/week');
            const tvs = await fetchAPI('/trending/tv/week');

            if (movies && movies.results) {
                document.getElementById('trending-movies').innerHTML = movies.results.map(item => createCard(item, 'movie')).join('');
            }
            if (tvs && tvs.results) {
                document.getElementById('trending-tv').innerHTML = tvs.results.map(item => createCard(item, 'tv')).join('');
            }
            lucide.createIcons();
        }

        // Card Component
        function createCard(item, type) {
            const title = item.title || item.name;
            const poster = item.poster_path ? IMG_URL + item.poster_path : 'https://via.placeholder.com/500x750?text=No+Cover';
            const year = (item.release_date || item.first_air_date || '').split('-')[0] || 'N/A';
            const rating = item.vote_average ? item.vote_average.toFixed(1) : 'NR';

            return `
                <article onclick="navigateTo('?view=watch&id=${item.id}&type=${type}')" class="group glass-panel rounded-xl overflow-hidden cursor-pointer hover:border-brand-500/50 hover:scale-[1.02] transition-all duration-300 flex flex-col justify-between">
                    <div class="relative aspect-[2/3] bg-slate-800 overflow-hidden">
                        <img src="${poster}" alt="مشاهدة ${title}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" onError="this.src='https://via.placeholder.com/500x750?text=No+Image'">
                        <div class="absolute top-2 left-2 bg-black/60 backdrop-blur-md px-2 py-1 rounded-md text-[11px] font-bold text-amber-400 flex items-center gap-1">
                            <i data-lucide="star" class="w-3 h-3 fill-amber-400"></i> ${rating}
                        </div>
                    </div>
                    <div class="p-3">
                        <h3 class="font-bold text-sm text-gray-100 truncate group-hover:text-brand-500 transition">${title}</h3>
                        <p class="text-xs text-gray-400 mt-1">${year} • ${type === 'movie' ? 'فيلم' : 'مسلسل'}</p>
                    </div>
                </article>
            `;
        }

        // Render Player Page
        async function renderPlayerPage(id, type) {
            const data = await fetchAPI(`/${type}/${id}`);
            if (!data) return;

            const title = data.title || data.name;
            const desc = data.overview ? `مشاهدة ${title} مترجم بجودة عالية. ${data.overview.slice(0, 120)}...` : `مشاهدة وتنزيل ${title} اون لاين مترجم بجودة HD.`;
            
            updateSEO(`مشاهدة ${title} مترجم - EFRINFLIX`, desc, data.poster_path ? IMG_URL + data.poster_path : '', type, data);
            saveWatchHistory(id, type, title, data.poster_path);

            const isFav = favorites.some(f => f.id == id);
            const backdrop = data.backdrop_path ? BACKDROP_URL + data.backdrop_path : '';

            const app = document.getElementById('app-container');
            app.innerHTML = `
                <div class="space-y-6">
                    <div class="relative rounded-3xl overflow-hidden glass-panel p-6 sm:p-8 flex flex-col md:flex-row gap-6 items-center md:items-end bg-cover bg-center" style="background-image: linear-gradient(to top, #0b0f17, rgba(11,15,23,0.7)), url('${backdrop}')">
                        <img src="${data.poster_path ? IMG_URL + data.poster_path : ''}" alt="${title}" class="w-40 sm:w-48 rounded-2xl shadow-2xl border border-white/10">
                        <div class="flex-1 text-center md:text-right space-y-3">
                            <h1 class="text-2xl sm:text-4xl font-extrabold text-white">مشاهدة ${title}</h1>
                            <p class="text-xs sm:text-sm text-gray-300 max-w-3xl line-clamp-3">${data.overview || 'لا يوجد وصف متوفر حالياً.'}</p>
                            <div class="flex flex-wrap items-center justify-center md:justify-start gap-4 text-xs font-semibold text-gray-300">
                                <span class="bg-brand-500/20 text-brand-500 border border-brand-500/30 px-3 py-1 rounded-full">${type === 'movie' ? 'فيلم' : 'مسلسل'}</span>
                                <span class="flex items-center gap-1 text-amber-400"><i data-lucide="star" class="w-4 h-4 fill-amber-400"></i> ${data.vote_average?.toFixed(1)}</span>
                                <span>📅 ${data.release_date || data.first_air_date || 'N/A'}</span>
                            </div>
                            <div class="pt-2">
                                <button onclick="toggleFavorite('${id}', '${type}', \`${title}\`, '${data.poster_path}')" id="fav-btn" class="bg-white/10 hover:bg-white/20 text-white border border-white/20 px-5 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 mx-auto md:mx-0">
                                    <i data-lucide="bookmark" class="w-4 h-4 ${isFav ? 'fill-brand-500 text-brand-500' : ''}"></i>
                                    <span>${isFav ? 'موجود بالمفضلة' : 'إضافة للمفضلة'}</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    ${type === 'tv' ? `
                        <div class="glass-panel p-4 rounded-2xl flex flex-wrap gap-4 items-center justify-between">
                            <div class="flex items-center gap-3">
                                <label class="text-xs font-bold text-gray-400">الموسم:</label>
                                <select id="season-select" onchange="updateEpisodes('${id}')" class="bg-slate-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:outline-none">
                                    ${Array.from({length: data.number_of_seasons}, (_, i) => `<option value="${i+1}">الموسم ${i+1}</option>`).join('')}
                                </select>
                            </div>
                            <div class="flex items-center gap-3">
                                <label class="text-xs font-bold text-gray-400">الحلقة:</label>
                                <select id="episode-select" onchange="changeEmbedSource('${id}', 'tv')" class="bg-slate-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:outline-none"></select>
                            </div>
                        </div>
                    ` : ''}

                    <div class="glass-panel p-4 rounded-2xl flex flex-wrap gap-2 items-center justify-between">
                        <span class="text-xs font-bold text-gray-400 flex items-center gap-2"><i data-lucide="server"></i> اختر سيرفر البث:</span>
                        <div class="flex flex-wrap gap-2">
                            <button onclick="switchServer(1, '${id}', '${type}')" class="srv-btn bg-brand-500 text-white px-4 py-2 rounded-xl text-xs font-bold">سيرفر 1 (VidSrc)</button>
                            <button onclick="switchServer(2, '${id}', '${type}')" class="srv-btn bg-slate-800 text-gray-300 px-4 py-2 rounded-xl text-xs font-bold hover:bg-slate-700">سيرفر 2 (Embed.su)</button>
                            <button onclick="switchServer(3, '${id}', '${type}')" class="srv-btn bg-slate-800 text-gray-300 px-4 py-2 rounded-xl text-xs font-bold hover:bg-slate-700">سيرفر 3 (AutoEmbed)</button>
                            <button onclick="switchServer(4, '${id}', '${type}')" class="srv-btn bg-slate-800 text-gray-300 px-4 py-2 rounded-xl text-xs font-bold hover:bg-slate-700">سيرفر 4 (VidSrc.cc)</button>
                        </div>
                    </div>

                    <div class="relative aspect-video rounded-3xl overflow-hidden glass-panel border border-white/10 bg-black shadow-2xl">
                        <div id="ad-shield" class="ad-shield" onclick="removeAdShield()" title="انقر لتشغيل المشغل"></div>
                        <iframe id="player-iframe" class="w-full h-full border-0" allowfullscreen src="https://vidsrc.to/embed/${type}/${id}"></iframe>
                    </div>
                </div>
            `;
            lucide.createIcons();
            if (type === 'tv') updateEpisodes(id);
        }

        async function updateEpisodes(tvId) {
            const season = document.getElementById('season-select').value;
            const seasonData = await fetchAPI(`/tv/${tvId}/season/${season}`);
            const epSelect = document.getElementById('episode-select');
            
            if (seasonData && seasonData.episodes) {
                epSelect.innerHTML = seasonData.episodes.map(ep => `<option value="${ep.episode_number}">الحلقة ${ep.episode_number} - ${ep.name}</option>`).join('');
                changeEmbedSource(tvId, 'tv');
            }
        }

        function switchServer(srvNum, id, type) {
            document.querySelectorAll('.srv-btn').forEach(btn => {
                btn.classList.remove('bg-brand-500', 'text-white');
                btn.classList.add('bg-slate-800', 'text-gray-300');
            });
            event.target.classList.add('bg-brand-500', 'text-white');
            changeEmbedSource(id, type, srvNum);
        }

        function changeEmbedSource(id, type, server = 1) {
            const iframe = document.getElementById('player-iframe');
            let season = 1, episode = 1;

            if (type === 'tv') {
                season = document.getElementById('season-select')?.value || 1;
                episode = document.getElementById('episode-select')?.value || 1;
            }

            let url = '';
            if (server === 1) {
                url = type === 'movie' ? `https://vidsrc.to/embed/movie/${id}` : `https://vidsrc.to/embed/tv/${id}/${season}/${episode}`;
            } else if (server === 2) {
                url = type === 'movie' ? `https://embed.su/embed/movie/${id}` : `https://embed.su/embed/tv/${id}/${season}/${episode}`;
            } else if (server === 3) {
                url = type === 'movie' ? `https://player.autoembed.cc/embed/movie/${id}` : `https://player.autoembed.cc/embed/tv/${id}/${season}/${episode}`;
            } else if (server === 4) {
                url = type === 'movie' ? `https://vidsrc.cc/v2/embed/movie/${id}` : `https://vidsrc.cc/v2/embed/tv/${id}/${season}/${episode}`;
            }

            iframe.src = url;
            resetAdShield();
        }

        function removeAdShield() {
            const shield = document.getElementById('ad-shield');
            if (shield) shield.style.display = 'none';
        }

        function resetAdShield() {
            const shield = document.getElementById('ad-shield');
            if (shield) shield.style.display = 'block';
        }

        async function performSearch() {
            const query = document.getElementById('search-input').value.trim();
            if (!query) return;
            navigateTo(`?view=search&q=${encodeURIComponent(query)}`);
        }

        async function fetchSearchResults(query) {
            updateSEO(`نتائج البحث عن: ${query} - EFRINFLIX`, `مشاهدة وتنزيل جميع الأفلام والمسلسلات المتعلقة بـ ${query}.`);
            const app = document.getElementById('app-container');
            app.innerHTML = `
                <h1 class="text-xl font-bold mb-6">نتائج البحث عن: <span class="text-brand-500">${query}</span></h1>
                <div id="search-results" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                    ${renderSkeletons()}
                </div>
            `;
            
            const data = await fetchAPI(`/search/multi?query=${encodeURIComponent(query)}`);
            if (data && data.results) {
                const filtered = data.results.filter(i => i.media_type === 'movie' || i.media_type === 'tv');
                document.getElementById('search-results').innerHTML = filtered.length > 0 
                    ? filtered.map(item => createCard(item, item.media_type)).join('') 
                    : '<p class="col-span-full text-center text-gray-400 py-12">لم يتم العثور على أي نتائج مطابقة.</p>';
            }
            lucide.createIcons();
        }

        function toggleFavorite(id, type, title, posterPath) {
            const index = favorites.findIndex(f => f.id == id);
            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push({ id, type, title, posterPath });
            }
            localStorage.setItem('efrinflix_favs', JSON.stringify(favorites));
            updateFavBadge();
            
            const btn = document.getElementById('fav-btn');
            if (btn) {
                const isFav = favorites.some(f => f.id == id);
                btn.innerHTML = `
                    <i data-lucide="bookmark" class="w-4 h-4 ${isFav ? 'fill-brand-500 text-brand-500' : ''}"></i>
                    <span>${isFav ? 'موجود بالمفضلة' : 'إضافة للمفضلة'}</span>
                `;
                lucide.createIcons();
            }
        }

        function updateFavBadge() {
            const badge = document.getElementById('fav-badge');
            if (favorites.length > 0) {
                badge.innerText = favorites.length;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        function showFavorites() {
            navigateTo('?view=favorites');
        }

        function renderFavoritesPage() {
            updateSEO("قائمة المفضلة الخاصة بك - EFRINFLIX");
            const app = document.getElementById('app-container');
            
            app.innerHTML = `
                <h1 class="text-xl font-bold mb-6 flex items-center gap-2">
                    <i data-lucide="bookmark" class="text-brand-500"></i> قائمة المفضلة
                </h1>
                ${favorites.length === 0 ? `
                    <div class="text-center py-16 glass-panel rounded-3xl">
                        <i data-lucide="film" class="w-12 h-12 text-gray-500 mx-auto mb-3"></i>
                        <p class="text-gray-400">قائمة المفضلة لديك فارغة حالياً.</p>
                    </div>
                ` : `
                    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                        ${favorites.map(item => createCard({ id: item.id, title: item.title, poster_path: item.posterPath }, item.type)).join('')}
                    </div>
                `}
            `;
            lucide.createIcons();
        }

        function saveWatchHistory(id, type, title, posterPath) {
            let history = JSON.parse(localStorage.getItem('efrinflix_history') || '[]');
            history = history.filter(h => h.id != id);
            history.unshift({ id, type, title, posterPath, date: Date.now() });
            localStorage.setItem('efrinflix_history', JSON.stringify(history.slice(0, 10)));
        }

        function renderContinueWatchingSection() {
            const history = JSON.parse(localStorage.getItem('efrinflix_history') || '[]');
            if (history.length === 0) return '';

            return `
                <section class="mb-10">
                    <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
                        <i data-lucide="history" class="text-amber-500"></i> متابعة المشاهدة
                    </h2>
                    <div class="flex gap-4 overflow-x-auto pb-4 hide-scrollbar">
                        ${history.map(item => `
                            <div onclick="navigateTo('?view=watch&id=${item.id}&type=${item.type}')" class="min-w-[140px] max-w-[140px] glass-panel rounded-xl overflow-hidden cursor-pointer hover:border-brand-500/50 transition">
                                <div class="aspect-[2/3] bg-slate-800">
                                    <img src="${item.posterPath ? IMG_URL + item.posterPath : 'https://via.placeholder.com/500x750'}" class="w-full h-full object-cover">
                                </div>
                                <div class="p-2">
                                    <h4 class="text-xs font-bold truncate">${item.title}</h4>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </section>
            `;
        }

        function openSpinWheel() {
            document.getElementById('wheel-modal').classList.remove('hidden');
        }

        function closeSpinWheel() {
            document.getElementById('wheel-modal').classList.add('hidden');
        }

        async function spinWheelAction() {
            const btn = document.getElementById('spin-btn');
            const display = document.getElementById('wheel-display');
            btn.disabled = true;
            btn.classList.add('opacity-50');

            display.innerHTML = `<span class="text-xs animate-pulse">جاري اختيار فيلم السهرة... 🎡</span>`;

            const data = await fetchAPI('/trending/movie/week');
            setTimeout(() => {
                if (data && data.results) {
                    const randomItem = data.results[Math.floor(Math.random() * data.results.length)];
                    display.innerHTML = `
                        <p class="text-xs text-amber-400 font-bold mb-1">تم الاختيار!</p>
                        <p class="text-sm font-black text-white">${randomItem.title}</p>
                    `;
                    confetti({ particleCount: 80, spread: 60, origin: { y: 0.6 } });
                    
                    setTimeout(() => {
                        closeSpinWheel();
                        navigateTo(`?view=watch&id=${randomItem.id}&type=movie`);
                        btn.disabled = false;
                        btn.classList.remove('opacity-50');
                    }, 1800);
                }
            }, 1200);
        }

        // Advanced Dynamic SEO & Schema Engine
        function updateSEO(title, description, image = "", type = "website", itemData = null) {
            document.title = title;
            document.getElementById('site-title').innerText = title;
            document.getElementById('meta-desc').setAttribute('content', description);
            
            // OpenGraph & Twitter Meta
            document.getElementById('og-title').setAttribute('content', title);
            document.getElementById('og-desc').setAttribute('content', description);
            document.getElementById('tw-title').setAttribute('content', title);
            document.getElementById('tw-desc').setAttribute('content', description);
            
            if (image) {
                document.getElementById('og-image').setAttribute('content', image);
                document.getElementById('tw-image').setAttribute('content', image);
            }

            // Dynamic Schema Injection for Google
            let schemaData = {
                "@context": "https://schema.org",
                "@type": "WebSite",
                "name": "EFRINFLIX",
                "url": window.location.href
            };

            if (itemData) {
                schemaData = {
                    "@context": "https://schema.org",
                    "@type": type === 'movie' ? "Movie" : "TVSeries",
                    "name": itemData.title || itemData.name,
                    "image": image,
                    "description": description,
                    "aggregateRating": itemData.vote_average ? {
                        "@type": "AggregateRating",
                        "ratingValue": itemData.vote_average,
                        "bestRating": "10",
                        "ratingCount": itemData.vote_count || 100
                    } : undefined
                };
            }

            document.getElementById('schema-json').textContent = JSON.stringify(schemaData);
        }
    </script>
</body>
</html>
